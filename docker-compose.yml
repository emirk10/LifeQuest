# LifeQuest — Docker Compose
version: "3.8"

services:
  # ─────────────────────────────────────────
  # PostgreSQL Veritabanı
  # ─────────────────────────────────────────
  db:
    image: postgres:15-alpine
    container_name: lifequest-db
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "${DB_PORT}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  # ─────────────────────────────────────────
  # pgAdmin (Veritabanı Yönetimi)
  # ─────────────────────────────────────────
  pgadmin:
    image: dpage/pgadmin4
    container_name: lifequest-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
    ports:
      - "5050:80"
    depends_on:
      - db

  # ─────────────────────────────────────────
  # Python AI Mikro Servis (HTTP)
  # ─────────────────────────────────────────
  ai_service:
    build:
      context: ./ai_service
      dockerfile: Dockerfile
    container_name: lifequest-ai
    ports:
      - "${AI_SERVICE_PORT}:5001"
    volumes:
      - ai_models:/app/models
    environment:
      - PYTHONUNBUFFERED=1
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5001/health')"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3

  # ─────────────────────────────────────────
  # .NET Backend API (HTTP)
  # ─────────────────────────────────────────
  api:
    build:
      context: ./LifeQuestAPI
      dockerfile: Dockerfile
    container_name: lifequest-api
    ports:
      - "5020:5020"
      - "7071:7071"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:5020
      - ConnectionStrings__DefaultConnection=Host=db;Port=5432;Database=${DB_NAME};Username=${DB_USER};Password=${DB_PASSWORD}
      - AIService__BaseUrl=http://ai_service:5001
    depends_on:
      - db
      - ai_service
    restart: unless-stopped

  # ─────────────────────────────────────────
  # Frontend (Vite/React) (HTTPS)
  # ─────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: lifequest-frontend
    ports:
      - "${FRONTEND_PORT}:5173"
    environment:
      # Ensure Vite can see environment variables
      - VITE_API_BASE_URL=http://localhost:5020/api
      - VITE_AI_SERVICE_URL=http://localhost:${AI_SERVICE_PORT}
    volumes:
      # Mount source code for hot reload
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - api
    restart: unless-stopped

volumes:
  ai_models:
    driver: local
  pgdata:
    driver: local
